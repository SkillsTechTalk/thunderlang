<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-label="ThunderLang at a glance: 1 write the rule, 2 OpenThunder compiles it (check, prove, generate), 3 hold your real code to it, 4 enforce it in CI.">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1280" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070E"/><stop offset="1" stop-color="#0E1322"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9A7CF7"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7C5CF0"/></marker>
  </defs>
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .h{font-size:22px;font-weight:700;fill:#EAF0FA}
    .s{font-size:16px;fill:#9AA6BF}
    .n{font-size:14px;font-weight:700;fill:#B49BFF;letter-spacing:2px}
    .c{font-size:13px;fill:#C9D3E6}
    .card{fill:#0A0E1A;stroke:#1B2438;stroke-width:1.5}
  </style>
  <rect width="1280" height="470" rx="24" fill="url(#bg2)"/>
  <text x="56" y="62" class="t" font-size="28" font-weight="800" fill="#EAF0FA">ThunderLang in 10 seconds</text>
  <text x="56" y="92" class="t s">Write the rule once. OpenThunder checks it, proves it, and holds your code to it.</text>

  <!-- 1 -->
  <rect x="56" y="124" width="268" height="300" rx="16" class="card"/>
  <text x="80" y="160" class="t n">1 · WRITE</text>
  <text x="80" y="192" class="t h">The rule, in words</text>
  <rect x="80" y="210" width="220" height="132" rx="10" fill="#080B14"/>
  <text x="94" y="236" class="m c" xml:space="preserve"><tspan fill="#B49BFF">decision</tspan> RefundPolicy</text>
  <text x="94" y="260" class="m c" xml:space="preserve">  when amount &lt;= 100</text>
  <text x="94" y="284" class="m c" xml:space="preserve"><tspan fill="#B49BFF">    return</tspan> <tspan fill="#67E8F9">Approve</tspan></text>
  <text x="94" y="308" class="m c" xml:space="preserve"><tspan fill="#B49BFF">  default</tspan> <tspan fill="#67E8F9">Review</tspan></text>
  <text x="94" y="332" class="m c" xml:space="preserve" fill="#6B7894"># readable in review</text>
  <text x="80" y="374" class="t s">A .thunder file in your repo.</text>
  <text x="80" y="398" class="t s">People and AI read the same rule.</text>

  <line x1="330" y1="274" x2="356" y2="274" stroke="#7C5CF0" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 2 -->
  <rect x="362" y="124" width="292" height="300" rx="16" fill="#0E1322" stroke="url(#hl)" stroke-width="2"/>
  <text x="386" y="160" class="t n">2 · OPENTHUNDER COMPILES</text>
  <text x="386" y="192" class="t h">Check · Prove · Generate</text>
  <text x="386" y="234" class="t" font-size="17" fill="#FBBF24">▲</text><text x="410" y="234" class="t c" font-size="16">Problems as you type, with why</text>
  <text x="386" y="270" class="t" font-size="17" fill="#34D399">✓</text><text x="410" y="270" class="t c" font-size="16">Run the rule's tests: 3/3 passed</text>
  <text x="386" y="306" class="t" font-size="17" fill="#67E8F9">{}</text><text x="410" y="306" class="t c" font-size="16">TypeScript, Python, C#, Java</text>
  <text x="386" y="374" class="t s">Compiler built in. No AI key.</text>
  <text x="386" y="398" class="t s">Same file, same answer, every time.</text>

  <line x1="660" y1="274" x2="686" y2="274" stroke="#7C5CF0" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 3 -->
  <rect x="692" y="124" width="268" height="300" rx="16" class="card"/>
  <text x="716" y="160" class="t n">3 · HOLD YOUR CODE</text>
  <text x="716" y="192" class="t h">Your app vs the rule</text>
  <rect x="716" y="210" width="230" height="96" rx="10" fill="#080B14"/>
  <text x="730" y="236" class="m c" xml:space="preserve"><tspan fill="#34D399">PASS</tspan> rule: $100 → Approve</text>
  <text x="730" y="262" class="m c" xml:space="preserve"><tspan fill="#F87171">FAIL</tspan> app:  $100 → Review</text>
  <text x="730" y="288" class="m c" xml:space="preserve" fill="#6B7894">off-by-one in your code</text>
  <text x="716" y="374" class="t s">intent test-app runs the rule's</text>
  <text x="716" y="398" class="t s">cases against your real code.</text>

  <line x1="966" y1="274" x2="992" y2="274" stroke="#7C5CF0" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 4 -->
  <rect x="998" y="124" width="226" height="300" rx="16" class="card"/>
  <text x="1022" y="160" class="t n">4 · ENFORCE</text>
  <text x="1022" y="192" class="t h">In CI, every PR</text>
  <text x="1022" y="236" class="m c" xml:space="preserve"><tspan fill="#34D399">0</tspan>  passed</text>
  <text x="1022" y="262" class="m c" xml:space="preserve"><tspan fill="#F87171">1</tspan>  broke the rule</text>
  <text x="1022" y="288" class="m c" xml:space="preserve"><tspan fill="#FBBF24">2</tspan>  not checked</text>
  <text x="1022" y="374" class="t s">A broken rule fails</text>
  <text x="1022" y="398" class="t s">the build, not production.</text>
</svg>
