<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Thunder, the Human-Native Programming Language, also called ThunderLang. The Human Programming Language. One language. Every ecosystem. Write software in a language you understand. Build with AI. Compile to the ecosystem you choose. Works today, a refund rule read in Thunder: approve when it is on time, the amount is at least $0 and at most $100; otherwise review. Asked about $100 on time, it answers Approve.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070E"/><stop offset="0.6" stop-color="#0A0E1A"/><stop offset="1" stop-color="#141B2E"/>
    </linearGradient>
    <linearGradient id="bolt" x1="30" y1="6" x2="70" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EDE9FE"/><stop offset="0.45" stop-color="#B49BFF"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9DDFF"/><stop offset="0.5" stop-color="#B49BFF"/><stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B49BFF" stop-opacity="0.75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="glow" cx="980" cy="200" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CF0" stop-opacity="0.38"/><stop offset="1" stop-color="#7C5CF0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#glow)"/>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Left: the promise -->
    <g transform="translate(60 62) scale(0.46)"><path d="M56 14 L30 56 L47 56 L42 86 L70 42 L52 42 L56 14 Z" fill="url(#bolt)"/></g>
    <text x="106" y="98" font-size="21" font-weight="600" fill="#DCE1EC"><tspan fill="url(#txt)" font-size="25" font-weight="800">Thunder</tspan><tspan font-size="11" dy="-12" fill="#B49BFF">TM</tspan><tspan dy="12">, the Human-Native Programming Language</tspan></text>
    <text x="64" y="172" font-size="58" font-weight="700" fill="#FFFFFF" letter-spacing="-2">The Human</text>
    <text x="64" y="234" font-size="58" font-weight="700" fill="url(#txt)" letter-spacing="-2">Programming Language.</text>
    <text x="64" y="282" font-size="24" font-weight="500" fill="#FFFFFF">One language. Every ecosystem.</text>
    <text x="64" y="318" font-size="17" fill="#9AA3B5">Write software in a language you understand. Build with AI.</text>
    <text x="64" y="342" font-size="17" fill="#9AA3B5">Compile to the ecosystem you choose.</text>
    <g font-size="13" fill="#C7CDDA">
      <rect x="64" y="366" width="196" height="28" rx="14" fill="none" stroke="#2A3346"/><text x="80" y="385">Also called ThunderLang™</text>
      <rect x="270" y="366" width="168" height="28" rx="14" fill="none" stroke="#2A3346"/><text x="286" y="385">Open source, Apache 2.0</text>
      <rect x="448" y="366" width="200" height="28" rx="14" fill="none" stroke="#2A3346"/><text x="464" y="385">Deterministic: no AI, no key</text>
    </g>

    <!-- Right: a rule read in Thunder -->
    <rect x="752" y="44" width="472" height="352" rx="22" fill="url(#frame)"/>
    <rect x="753.5" y="45.5" width="469" height="349" rx="21" fill="#0B0F1C"/>
    <text x="784" y="82" font-size="12" font-weight="700" letter-spacing="1.6" fill="#B49BFF">WORKS TODAY: READ IN THUNDER</text>
    <rect x="784" y="98" width="17" height="17" rx="3" fill="none" stroke="#9AA3B5" stroke-width="1.6"/>
    <text x="812" y="113" font-size="20" font-weight="600" fill="#FFFFFF">Refund approval</text>
    <path d="M793 132 l8 8 -8 8 -8 -8z" fill="none" stroke="#9AA3B5" stroke-width="1.6"/>
    <text x="812" y="146" font-size="16" font-weight="600" fill="#7FB2FF">When do we approve a refund?</text>
    <line x1="796" y1="160" x2="796" y2="300" stroke="#2A3346" stroke-width="1.5"/>
    <rect x="812" y="162" width="78" height="26" rx="13" fill="#67E8F9" fill-opacity="0.08" stroke="#67E8F9" stroke-opacity="0.5"/>
    <text x="826" y="180" font-size="14" font-weight="600" fill="#67E8F9">Approve</text>
    <text x="900" y="180" font-size="14" font-weight="600" fill="#C4B5FD">when all of these are true</text>
    <g font-size="15">
      <text x="830" y="210"><tspan fill="#A78BFA">it is </tspan><tspan fill="#FCD34D">on time</tspan></text>
      <text x="830" y="236"><tspan fill="#FCD34D">the amount </tspan><tspan fill="#A78BFA">is </tspan><tspan fill="#F472B6">at least </tspan><tspan fill="#FDBA74">$0</tspan></text>
      <text x="830" y="262"><tspan fill="#FCD34D">the amount </tspan><tspan fill="#A78BFA">is </tspan><tspan fill="#F472B6">at most </tspan><tspan fill="#FDBA74">$100</tspan></text>
    </g>
    <text x="812" y="294" font-size="14" font-weight="600" fill="#C4B5FD">Otherwise,</text>
    <rect x="892" y="276" width="70" height="26" rx="13" fill="#67E8F9" fill-opacity="0.08" stroke="#67E8F9" stroke-opacity="0.5"/>
    <text x="905" y="294" font-size="14" font-weight="600" fill="#67E8F9">Review</text>
    <line x1="784" y1="316" x2="1192" y2="316" stroke="#1F2738"/>
    <text x="784" y="346" font-size="17"><tspan fill="#FDBA74">$100</tspan><tspan fill="#DCE1EC">, </tspan><tspan fill="#FCD34D">on time</tspan><tspan fill="#6B7385">  →</tspan></text>
    <rect x="928" y="328" width="80" height="26" rx="13" fill="#67E8F9" fill-opacity="0.08" stroke="#67E8F9" stroke-opacity="0.5"/>
    <text x="942" y="346" font-size="14" font-weight="600" fill="#67E8F9">Approve</text>
    <text x="784" y="376" font-size="13" fill="#6EE7B7">✓ on time    ✓ at least $0    ✓ at most $100</text>
  </g>
</svg>
