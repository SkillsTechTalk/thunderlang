<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="ThunderLang: program what you mean. Rules people can read, compiled and proven by OpenThunder.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070E"/><stop offset="0.6" stop-color="#0A0E1A"/><stop offset="1" stop-color="#141B2E"/>
    </linearGradient>
    <linearGradient id="bolt" x1="30" y1="6" x2="70" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EDE9FE"/><stop offset="0.45" stop-color="#B49BFF"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B49BFF"/><stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="glow" cx="1040" cy="120" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CF0" stop-opacity="0.35"/><stop offset="1" stop-color="#7C5CF0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>
  <g transform="translate(72 64) scale(0.9)">
    <rect width="100" height="100" rx="22" fill="#0A0E1A" stroke="#1B2438" stroke-width="2"/>
    <path d="M56 14 L30 56 L47 56 L42 86 L70 42 L52 42 L56 14 Z" fill="url(#bolt)"/>
  </g
  ><text x="178" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="700" fill="#EAF0FA">Thunder<tspan fill="url(#txt)">Lang</tspan></text>
  <text x="72" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="#EAF0FA" letter-spacing="-1.5">Program what <tspan fill="url(#txt)">you mean.</tspan></text>
  <text x="72" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#9AA6BF">Rules people can read. A compiler that proves them. Built into OpenThunder.</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" xml:space="preserve">
    <rect x="880" y="70" width="336" height="220" rx="14" fill="#080B14" stroke="#1B2438"/>
    <circle cx="904" cy="92" r="5" fill="#F87171"/><circle cx="922" cy="92" r="5" fill="#FBBF24"/><circle cx="940" cy="92" r="5" fill="#34D399"/>
    <text x="904" y="132" xml:space="preserve" fill="#B49BFF">decision <tspan fill="#EAF0FA">RefundPolicy</tspan></text>
    <text x="904" y="162" xml:space="preserve" fill="#B49BFF">  rule <tspan fill="#EAF0FA">small-refund</tspan></text>
    <text x="904" y="190" xml:space="preserve" fill="#9AA6BF">    when amount &lt;= 100</text>
    <text x="904" y="218" xml:space="preserve" fill="#B49BFF">    return <tspan fill="#67E8F9">Approve</tspan></text>
    <text x="904" y="246" xml:space="preserve" fill="#B49BFF">  default <tspan fill="#9AA6BF">→</tspan> <tspan fill="#67E8F9">Review</tspan></text>
    <text x="904" y="276" xml:space="preserve" fill="#34D399">✓ 3/3 tests passed</text>
  </g>
</svg>
