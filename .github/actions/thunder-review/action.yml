name: 'Thunder Review (moved)'
description: 'Moved to the repository root: use SkillsTechTalk/thunderlang@<ref>. This wrapper keeps old workflows working.'
author: 'Skills Tech Talk'
branding:
  icon: 'zap'
  color: 'yellow'

# Kept so workflows that copied the earlier example (uses: SkillsTechTalk/thunderlang/.github/actions/thunder-review@main)
# keep working. New workflows: docs/github-action.md.

inputs:
  base:
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  head:
    required: false
    default: ${{ github.event.pull_request.head.sha }}
  version:
    required: false
    default: '1.3.0'
  thunder:
    required: false
    default: ''
  comment:
    required: false
    default: 'true'
  github-token:
    required: false
    default: ${{ github.token }}
  fail-on-risk:
    description: 'true is the same as fail-on: risk on the new action.'
    required: false
    default: 'false'

outputs:
  says:
    value: ${{ steps.review.outputs.says }}
  risks:
    value: ${{ steps.review.outputs.risks }}
  meaning:
    value: ${{ steps.review.outputs.meaning }}
  markdown-file:
    value: ${{ steps.review.outputs.markdown-file }}

runs:
  using: 'composite'
  steps:
    - name: Review in Thunder
      id: review
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_HEAD: ${{ inputs.head }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_FAIL_ON: ${{ inputs.fail-on-risk == 'true' && 'risk' || 'none' }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_THUNDER: ${{ inputs.thunder }}
      # The same script as the root action, from this same checkout of the repository.
      run: node "$GITHUB_ACTION_PATH/../../../action/thunder-review.mjs"
